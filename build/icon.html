<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1024px;height:1024px;background:transparent}
  svg{display:block}
</style>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B232D"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6E72"/>
      <stop offset="1" stop-color="#D93B40"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="186" fill="none" stroke="#2C3A4A" stroke-width="6"/>

  <!-- chip body -->
  <circle cx="512" cy="512" r="290" fill="url(#chip)"/>

  <!-- chip edge notches -->
  <g fill="#F7FAFC">
    <g transform="rotate(0 512 512)"><rect x="472" y="222" width="80" height="86" rx="14"/></g>
    <g transform="rotate(60 512 512)"><rect x="472" y="222" width="80" height="86" rx="14"/></g>
    <g transform="rotate(120 512 512)"><rect x="472" y="222" width="80" height="86" rx="14"/></g>
    <g transform="rotate(180 512 512)"><rect x="472" y="222" width="80" height="86" rx="14"/></g>
    <g transform="rotate(240 512 512)"><rect x="472" y="222" width="80" height="86" rx="14"/></g>
    <g transform="rotate(300 512 512)"><rect x="472" y="222" width="80" height="86" rx="14"/></g>
  </g>

  <!-- chip inner face -->
  <circle cx="512" cy="512" r="212" fill="#0B0F14"/>
  <circle cx="512" cy="512" r="212" fill="none" stroke="#F5BE3F" stroke-width="20"/>

  <!-- hour ticks at 12 / 3 / 6 / 9 -->
  <g fill="#F5BE3F">
    <rect x="500" y="336" width="24" height="52" rx="12"/>
    <rect x="500" y="636" width="24" height="52" rx="12"/>
    <rect x="336" y="500" width="52" height="24" rx="12"/>
    <rect x="636" y="500" width="52" height="24" rx="12"/>
  </g>

  <!-- hands, 10:10 -->
  <g stroke="#F7FAFC" stroke-linecap="round" fill="none">
    <line x1="512" y1="512" x2="404" y2="430" stroke-width="34"/>
    <line x1="512" y1="512" x2="620" y2="430" stroke-width="26"/>
  </g>
  <circle cx="512" cy="512" r="26" fill="#45C7B2"/>
</svg>

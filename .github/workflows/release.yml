name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run dist:mac
          - os: windows-latest
            build: npm run dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: ${{ matrix.build }}
        env:
          # No Apple Developer cert; skip signing rather than failing the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Unsigned test builds. First launch needs one extra step:

            **macOS** — you'll see "Apple cannot check it for malicious software".
            On macOS 15 and later, dismiss it, then go to **System Settings → Privacy
            & Security**, scroll to the bottom, and click **Open Anyway**. On macOS 14
            and earlier, right-click the app → **Open** → **Open**.
            To skip all that: `xattr -dr com.apple.quarantine "/Applications/Tournament Clock.app"`

            **Windows** — SmartScreen will warn. Click **More info** then **Run anyway**.

            Downloads: `-arm64.dmg` for Apple Silicon Macs, `-x64.dmg` for Intel Macs,
            the `Setup` `.exe` to install on Windows, or the `portable.exe` to run without installing.
